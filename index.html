    // =========================================================================
    // 視覺化圖表渲染元件 (Task 1 Interactive Visual Chart Renderer)
    // =========================================================================
    function Task1ChartViewer({ chartData, theme }) {
      if (!chartData) return null;

      const isDark = theme === 'dark';

      // 1. 折線圖渲染 (Line Graph SVG)
      if (chartData.type === 'line') {
        const width = 560;
        const height = 250;
        const padLeft = 45;
        const padRight = 25;
        const padTop = 25;
        const padBottom = 35;
        const plotW = width - padLeft - padRight;
        const plotH = height - padTop - padBottom;
        const maxY = 70;

        const getX = (idx) => padLeft + (idx / (chartData.labels.length - 1)) * plotW;
        const getY = (val) => padTop + plotH - (val / maxY) * plotH;

        return (
          <div className={`p-4 rounded-2xl border space-y-3 ${isDark ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-500 block">
                  📊 Task 1 模擬考題視覺化圖表 (Line Graph)
                </span>
                <h4 className="text-sm font-bold">{chartData.title}</h4>
              </div>
              <span className="text-xs opacity-60">單位: {chartData.unit}</span>
            </div>

            <div className="flex flex-wrap gap-3 text-xs">
              {chartData.series.map((s) => (
                <div key={s.name} className="flex items-center gap-1.5">
                  <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: s.color }} />
                  <span className="font-medium">{s.name}</span>
                </div>
              ))}
            </div>

            <div className="w-full overflow-x-auto">
              <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto min-w-[320px]">
                {[0, 15, 30, 45, 60].map((tick) => {
                  const y = getY(tick);
                  return (
                    <g key={tick}>
                      <line x1={padLeft} y1={y} x2={width - padRight} y2={y} stroke={isDark ? '#1e293b' : '#e2e8f0'} strokeDasharray="4 4" />
                      <text x={padLeft - 8} y={y + 4} textAnchor="end" fontSize="11" fill={isDark ? '#94a3b8' : '#64748b'}>
                        {tick}
                      </text>
                    </g>
                  );
                })}

                {chartData.labels.map((label, idx) => {
                  const x = getX(idx);
                  return (
                    <text key={label} x={x} y={height - 10} textAnchor="middle" fontSize="11" fontWeight="bold" fill={isDark ? '#cbd5e1' : '#334155'}>
                      {label}
                    </text>
                  );
                })}

                {chartData.series.map((s) => {
                  const points = s.values.map((v, i) => `${getX(i)},${getY(v)}`).join(' ');
                  return (
                    <g key={s.name}>
                      <polyline fill="none" stroke={s.color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" points={points} />
                      {s.values.map((v, i) => (
                        <circle key={i} cx={getX(i)} cy={getY(v)} r="4" fill={s.color} stroke={isDark ? '#0f172a' : '#ffffff'} strokeWidth="2" />
                      ))}
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      }

      // 2. 分組長條圖渲染 (Bar Chart)
      if (chartData.type === 'bar') {
        return (
          <div className={`p-4 rounded-2xl border space-y-4 ${isDark ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-500 block">
                  📊 Task 1 模擬考題視覺化圖表 (Bar Chart)
                </span>
                <h4 className="text-sm font-bold">{chartData.title}</h4>
              </div>
              <span className="text-xs opacity-60">單位: {chartData.unit}</span>
            </div>

            <div className="flex flex-wrap gap-3 text-xs">
              {chartData.series.map((s) => (
                <div key={s.name} className="flex items-center gap-1.5">
                  <span className="w-3 h-3 rounded-sm inline-block" style={{ backgroundColor: s.color }} />
                  <span className="font-medium">{s.name}</span>
                </div>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              {chartData.categories.map((country, cIdx) => (
                <div key={country} className={`p-3 rounded-xl border space-y-2 ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <div className="text-xs font-bold">{country}</div>
                  <div className="space-y-1.5">
                    {chartData.series.map((s) => {
                      const val = s.values[cIdx];
                      return (
                        <div key={s.name} className="space-y-0.5">
                          <div className="flex justify-between text-[11px]">
                            <span className="opacity-75">{s.name}</span>
                            <span className="font-mono font-bold" style={{ color: s.color }}>{val}%</span>
                          </div>
                          <div className="w-full h-2 rounded-full bg-slate-800/40 overflow-hidden">
                            <div className="h-full rounded-full transition-all duration-500" style={{ width: `${val}%`, backgroundColor: s.color }} />
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // 3. 雙圓餅圖渲染 (Pie Charts)
      if (chartData.type === 'pie') {
        const buildConicGradient = (slices) => {
          let acc = 0;
          const stops = slices.map((sl) => {
            const start = acc;
            acc += sl.value;
            return `${sl.color} ${start}% ${acc}%`;
          });
          return `conic-gradient(${stops.join(', ')})`;
        };

        return (
          <div className={`p-4 rounded-2xl border space-y-4 ${isDark ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
            <div>
              <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-500 block">
                📊 Task 1 模擬考題視覺化圖表 (Two Pie Charts)
              </span>
              <h4 className="text-sm font-bold">{chartData.title}</h4>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {chartData.charts.map((ch) => (
                <div key={ch.year} className={`p-4 rounded-xl border flex flex-col items-center gap-3 ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <span className="text-xs font-bold px-3 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                    Year {ch.year}
                  </span>
                  <div className="w-28 h-28 rounded-full shadow-inner relative flex items-center justify-center" style={{ background: buildConicGradient(ch.slices) }}>
                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xs font-bold ${isDark ? 'bg-slate-900 text-slate-200' : 'bg-white text-slate-800'}`}>
                      {ch.year}
                    </div>
                  </div>

                  <div className="w-full space-y-1 text-xs">
                    {ch.slices.map((sl) => (
                      <div key={sl.name} className="flex items-center justify-between">
                        <div className="flex items-center gap-1.5">
                          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ backgroundColor: sl.color }} />
                          <span className="opacity-85">{sl.name}</span>
                        </div>
                        <span className="font-mono font-bold">{sl.value}%</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // 4. 工序流程圖渲染 (Process Diagram)
      if (chartData.type === 'process') {
        return (
          <div className={`p-4 rounded-2xl border space-y-4 ${isDark ? 'bg-slate-950/90 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
            <div>
              <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-500 block">
                🔄 Task 1 模擬考題視覺化圖表 (Process Diagram)
              </span>
              <h4 className="text-sm font-bold">{chartData.title}</h4>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {chartData.steps.map((st) => (
                <div key={st.step} className={`p-3.5 rounded-xl border relative flex flex-col justify-between gap-2 ${isDark ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400">
                      Stage {st.step}
                    </span>
                    <span className="text-lg">{st.icon}</span>
                  </div>
                  <div>
                    <div className="text-xs font-bold text-emerald-400">{st.title}</div>
                    <p className="text-[11px] opacity-75 mt-0.5 leading-snug">{st.desc}</p>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      return null;
    }

    // =========================================================================

      const STORAGE_KEY = 'ielts_ascender_55_65_v1';

      const [cloudStatus, setCloudStatus] = useState('synced');
      const [lastSyncedTime, setLastSyncedTime] = useState(

      const [fontSize, setFontSize] = useState('base');
      const [activeTab, setActiveTab] = useState('editor');
      const [toastMsg, setToastMsg] = useState(null);

      const [essayText, setEssayText] = useState(
        'Nowadays, traffic jam is a big problem in many cities. Lots of people drive cars because public transport is not good. Although governments want to fix this, but they do not have enough money. If kids cannot go to school on time, they get bad things for study. Therefore, I think governments should do something to solve it.'
      );
      const [customPatterns, setCustomPatterns] = useState([]);
      const [newInformal, setNewInformal] = useState('');
      const [newReplacement, setNewReplacement] = useState('');
      const [showAddVocab, setShowAddVocab] = useState(false);

      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [aiReport, setAiReport] = useState(null);
      const [quickCopySuccess, setQuickCopySuccess] = useState(false);

      const [gymAnswers, setGymAnswers] = useState({});
      const [gymActiveIndex, setGymActiveIndex] = useState(0);

      const [selectedTemplate, setSelectedTemplate] = useState(SENTENCE_TEMPLATES[0]);
      const [builderPartA, setBuilderPartA] = useState(SENTENCE_TEMPLATES[0].defaultA);
      const [builderPartB, setBuilderPartB] = useState(SENTENCE_TEMPLATES[0].defaultB);
      const [savedSentences, setSavedSentences] = useState([]);

      const [selectedEssayId, setSelectedEssayId] = useState(MODEL_ESSAYS[0].id);
      const [essayFilter, setEssayFilter] = useState('ALL');

      const [progressHistory, setProgressHistory] = useState([
        {
          id: 'log-init-1',
          date: '10/24',
          errorFreeRatio: 42,
          bandEstimate: '5.5',
          informalCount: 5,
          note: '初次診斷：存在逗號黏連與口語化詞彙'
        }
      ]);

      const textareaRef = useRef(null);

      const triggerToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      // 載入本機/同步狀態
      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed.essayText !== undefined) setEssayText(parsed.essayText);
            if (parsed.theme) setTheme(parsed.theme);
            if (parsed.fontSize) setFontSize(parsed.fontSize);
            if (parsed.gymAnswers) setGymAnswers(parsed.gymAnswers);
            if (parsed.savedSentences) setSavedSentences(parsed.savedSentences);
            if (parsed.customPatterns) setCustomPatterns(parsed.customPatterns);
            if (parsed.progressHistory) setProgressHistory(parsed.progressHistory);
          }
        } catch (e) {
          console.error('Failed to load state:', e);
        }
      }, []);

      const syncMainStateToCloud = (updates = {}) => {
        try {
          const currentRaw = localStorage.getItem(STORAGE_KEY);
          const currentData = currentRaw ? JSON.parse(currentRaw) : {};
          const merged = {
            essayText,
            theme,
            fontSize,
            gymAnswers,
            savedSentences,
            customPatterns,
            progressHistory,
            ...currentData,
            ...updates,
            updatedAt: Date.now()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
          setLastSyncedTime(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        } catch (e) {
          console.error('Save error:', e);
        }
      };

      useEffect(() => {
        const timer = setTimeout(() => {
          syncMainStateToCloud({ essayText });
        }, 800);
        return () => clearTimeout(timer);
      }, [essayText]);

      const handleAddCustomVocab = () => {
        if (!newInformal.trim() || !newReplacement.trim()) return;
        const vocabId = `cust-${Date.now()}`;
        const newEntry = {
          id: vocabId,
          informal: newInformal.trim().toLowerCase(),
          replacement: newReplacement.trim(),
          category: '自訂詞庫',
          isCustom: true
        };
        const updated = [newEntry, ...customPatterns];
        setCustomPatterns(updated);
        syncMainStateToCloud({ customPatterns: updated });
        triggerToast(`已同步新增自訂替換規則：「${newEntry.informal} → ${newEntry.replacement}」`);
        setNewInformal('');
        setNewReplacement('');
        setShowAddVocab(false);
      };

      const handleDeleteCustomVocab = (id) => {
        const updated = customPatterns.filter((item) => item.id !== id);
        setCustomPatterns(updated);
        syncMainStateToCloud({ customPatterns: updated });
      };

      const allInformalPatterns = useMemo(() => {
        return [...customPatterns, ...DEFAULT_INFORMAL_PATTERNS];
      }, [customPatterns]);

      const fontClass = useMemo(() => {
        switch (fontSize) {
          case 'sm': return 'text-xs sm:text-sm leading-relaxed';
          case 'lg': return 'text-base sm:text-lg leading-relaxed';
          case 'xl': return 'text-lg sm:text-xl leading-relaxed';
          case 'base':
          default: return 'text-sm sm:text-base leading-relaxed';
        }
      }, [fontSize]);

      const detectedInformals = useMemo(() => {
        if (!essayText) return [];
        const lower = essayText.toLowerCase();
        const hits = [];
        allInformalPatterns.forEach((item) => {
          let count = 0;
          let pos = lower.indexOf(item.informal);
          while (pos !== -1) {
            count++;
            pos = lower.indexOf(item.informal, pos + item.informal.length);
          }
          if (count > 0) {
            hits.push({ ...item, count });
          }
        });
        return hits;
      }, [essayText, allInformalPatterns]);

      const localGrammarStats = useMemo(() => {
        if (!essayText.trim()) {
          return { totalSentences: 0, commaSpliceCount: 0, doubleConjunctions: 0 };
        }
        const sentences = essayText
          .split(/(?<=[.?!])\s+/)
          .map((s) => s.trim())
          .filter(Boolean);

        let doubleConjunctions = 0;
        if (/although[\s\S]{3,60}\bbut\b/i.test(essayText)) {
          doubleConjunctions += 1;
        }

        const commaSpliceMatches = essayText.match(/,\s+(they|he|she|it|we|you)\s+[a-z]+/gi);
        const commaSpliceCount = commaSpliceMatches ? commaSpliceMatches.length : 0;

        return {
          totalSentences: sentences.length,
          commaSpliceCount,
          doubleConjunctions
        };
      }, [essayText]);

      const handleInsertText = (snippet) => {
        const el = textareaRef.current;
        if (!el) {
          setEssayText((prev) => `${prev} ${snippet}`);
          return;
        }
        const start = el.selectionStart;
        const end = el.selectionEnd;
        const before = essayText.substring(0, start);
        const after = essayText.substring(end, essayText.length);
        const nextText = `${before}${snippet}${after}`;
        setEssayText(nextText);

        setTimeout(() => {
          el.focus();
          el.selectionStart = el.selectionEnd = start + snippet.length;
        }, 50);
      };

      const handleReplaceInformal = (informalWord, replacementWord) => {
        const primaryReplacement = replacementWord.split('/')[0].trim();
        const regex = new RegExp(`\\b${informalWord}\\b`, 'gi');
        const newText = essayText.replace(regex, primaryReplacement);
        setEssayText(newText);
        triggerToast(`已將 "${informalWord}" 升級為 "${primaryReplacement}"`);
      };

      const handleSelectTemplate = (tpl) => {
        setSelectedTemplate(tpl);
        setBuilderPartA(tpl.defaultA);
        setBuilderPartB(tpl.defaultB);
      };

      const handleRunAiDiagnostics = () => {
        if (!essayText.trim() || essayText.trim().split(/\s+/).length < 10) {
          triggerToast('請先輸入至少 10 個單詞的草稿，以便計算無錯句率！');
          return;
        }

        setIsAnalyzing(true);
        setAiReport(null);

        setTimeout(() => {
          const totalSents = Math.max(1, localGrammarStats.totalSentences);
          const flawPenalty = detectedInformals.length + localGrammarStats.commaSpliceCount + localGrammarStats.doubleConjunctions;
          const errorFreeSents = Math.max(1, totalSents - Math.min(totalSents - 1, flawPenalty));
          const calculatedRatio = Math.round((errorFreeSents / totalSents) * 100);
          const isSafe = calculatedRatio >= 65 && detectedInformals.length === 0;

          const issuesList = [];
          if (localGrammarStats.doubleConjunctions > 0) {
            issuesList.push({
              flawType: 'GRA 雙重連接詞 (Double Conjunction)',
              originalSegment: 'Although governments want to fix this, but they do not have enough money',
              correction: 'Although governments aspire to resolve this issue, they lack sufficient financial resources',

                        <div className="space-y-1">
                          <span
                            className={`text-[10px] px-1.5 py-0.5 rounded font-bold inline-block ${
                              selectedEssayId === essay.id
                                ? 'bg-slate-950/20 text-slate-950'
                                : essay.category === 'Task 1'
                                ? 'bg-sky-500/15 text-sky-400'
                                : 'bg-emerald-500/15 text-emerald-400'
                            }`}
                          >
                            {essay.category} {essay.chartData ? '📊 附圖表' : ''}
                          </span>
                          <div className="text-xs leading-snug">{essay.title}</div>
                        </div>
                        <div className="flex items-center justify-between mt-2 pt-1.5 border-t border-current/10 text-[10px] opacity-80">
                          <span>{essay.taskType}</span>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {currentModelEssay && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
                    <div className="lg:col-span-8 space-y-4">
                      <div
                        className={`p-4 rounded-2xl border ${
                          theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                        }`}
                      >
                        <div className="flex items-center justify-between mb-1.5">
                          <span className="text-xs font-bold text-amber-500 uppercase tracking-wider">
                            官方考題題目 ({currentModelEssay.taskType})
                          </span>
                          <span className="text-xs px-2.5 py-0.5 rounded-full font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                            {currentModelEssay.targetBand}
                          </span>
                        </div>
                        <p className={`font-medium ${fontClass}`}>{currentModelEssay.prompt}</p>
                      </div>

                      {currentModelEssay.chartData && (
                        <Task1ChartViewer chartData={currentModelEssay.chartData} theme={theme} />
                      )}

                      {currentModelEssay.paragraphs.map((para, index) => (
                        <div
                          key={index}
                          className={`p-5 rounded-2xl border shadow-sm space-y-3 ${
                            theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                          }`}
                        >
                          <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-800/40">
                            <span className="text-xs font-bold text-emerald-500">{para.role}</span>
                            <button
                              onClick={() => {
                                setEssayText(para.text);
                                setActiveTab('editor');
                                triggerToast('已將此段落載入寫作診斷室，可進行仿寫或分析！');
                              }}
                              className={`text-[11px] px-2.5 py-1 rounded-lg border font-semibold transition ${
                                theme === 'dark'
                                  ? 'bg-slate-800 border-slate-700 text-emerald-400 hover:bg-slate-700'
                                  : 'bg-slate-100 border-slate-300 text-emerald-700 hover:bg-slate-200'
                              }`}
                            >
                              載入此段至編輯器摹寫
                            </button>
                          </div>

                          <p className={`leading-relaxed font-serif ${fontClass}`}>{para.text}</p>

                          <div
                            className={`p-3 rounded-xl border text-xs space-y-2 ${
                              theme === 'dark'
                                ? 'bg-slate-950/80 border-slate-800 text-slate-300'
                                : 'bg-slate-50 border-slate-200 text-slate-700'
                            }`}
                          >
                            <div>
                              <strong className="text-amber-400">💡 考官結構拆解：</strong>
                              {para.analysis}
                            </div>
                            <div className="flex flex-wrap items-center gap-1.5 pt-1">
                              <span className="text-[11px] opacity-70">必學高分語塊 (點擊插入草稿)：</span>
                              {para.highlights.map((hl, i) => (
                                <button
                                  key={i}
                                  onClick={() => {
                                    handleInsertText(`${hl} `);
                                    triggerToast(`已將語塊 "${hl}" 插入草稿區！`);
                                  }}
                                  className="px-2 py-0.5 rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 text-[11px] font-mono hover:bg-emerald-500/25 transition"
                                >
                                  + {hl}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="lg:col-span-4 lg:sticky lg:top-24 space-y-4">
                      <div
                        className={`p-5 rounded-2xl border shadow-lg space-y-4 ${
                          theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                        }`}
                      >
                        <h3 className="text-sm font-bold flex items-center gap-2 text-emerald-500">
                          <Sparkles className="w-4 h-4" />
                          <span>本篇範文奪分心法</span>
                        </h3>

                        <ul className="space-y-2.5 text-xs leading-relaxed">
                          {currentModelEssay.keyTakeaways.map((kt, idx) => (
                            <li key={idx} className="flex items-start gap-2">
                              <CheckCircle2 className="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" />
                              <span>{kt}</span>
                            </li>
                          ))}
                        </ul>

                        <div className="pt-3 border-t border-slate-800/40">
                          <button
                            onClick={() => {
                              const fullText = currentModelEssay.paragraphs.map((p) => p.text).join('\n\n');
                              setEssayText(fullText);
                              setActiveTab('editor');
                              triggerToast('已將整篇高分範文載入寫作診斷室！');
                            }}
                            className="w-full py-2.5 rounded-xl text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-md transition flex items-center justify-center gap-1.5"
                          >
                            <FileText className="w-4 h-4" />
                            <span>將整篇範文載入編輯器分析</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'progress' && (
              <div className="max-w-4xl mx-auto space-y-5">
                <div
                  className={`p-5 rounded-2xl border shadow-sm transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}
                >
                  <div>
                    <h2 className="text-base sm:text-lg font-bold flex items-center gap-2">
                      <History className="w-5 h-5 text-emerald-500" />
                      <span>學習日誌與個人詞庫</span>
                    </h2>
                    <p className="text-xs opacity-75 mt-0.5">
                      你的每次診斷紀錄、10 關考官擂台成績與自訂戒除詞皆已自動儲存。
                    </p>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-xs px-3 py-1.5 rounded-xl font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                      累積評測: {progressHistory.length} 次
                    </span>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                  <div
                    className={`p-4 rounded-xl border flex items-center gap-3 ${
                      gymCorrectCount >= 8
                        ? 'border-emerald-500/50 bg-emerald-500/10'
                        : 'opacity-50 border-slate-800 bg-slate-900/30'
                    }`}
                  >
                    <div className="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400 font-bold">
                      <ShieldCheck className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="text-xs font-bold">十關斬將考官之眼</div>
                      <div className="text-[11px] opacity-70">
                        改錯擂台答對 8 題以上 ({gymCorrectCount}/10)
                      </div>
                    </div>
                  </div>

                  <div
                    className={`p-4 rounded-xl border flex items-center gap-3 ${
                      progressHistory.some((h) => h.errorFreeRatio >= 65)
                        ? 'border-emerald-500/50 bg-emerald-500/10'
                        : 'opacity-50 border-slate-800 bg-slate-900/30'
                    }`}
                  >
                    <div className="w-10 h-10 rounded-xl bg-teal-500/20 flex items-center justify-center text-teal-400 font-bold">
                      <TrendingUp className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="text-xs font-bold">無錯句率突破 65%</div>
                      <div className="text-[11px] opacity-70">正式進入 Band 6.5 安全防禦區</div>
                    </div>
                  </div>

                  <div
                    className={`p-4 rounded-xl border flex items-center gap-3 ${
                      detectedInformals.length === 0
                        ? 'border-emerald-500/50 bg-emerald-500/10'
                        : 'opacity-50 border-slate-800 bg-slate-900/30'
                    }`}
                  >
                    <div className="w-10 h-10 rounded-xl bg-amber-500/20 flex items-center justify-center text-amber-400 font-bold">
                      <Award className="w-5 h-5" />
                    </div>
                    <div>
                      <div className="text-xs font-bold">口語詞清零大師</div>
                      <div className="text-[11px] opacity-70">當前草稿完全無 5.5 口語詞彙</div>
                    </div>
                  </div>
                </div>

                <div
                  className={`p-5 rounded-2xl border shadow-sm space-y-3 ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <h3 className="text-xs font-bold uppercase tracking-wider text-emerald-500">
                      我的自訂口語替換詞庫 ({customPatterns.length})
                    </h3>
                  </div>

                  {customPatterns.length === 0 ? (
                    <p className="text-xs opacity-60">
                      尚未新增自訂詞彙。你可以在「1. 寫作診斷室」點擊「新增自訂戒除詞」建立專屬替換表。
                    </p>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                      {customPatterns.map((cp) => (
                        <div
                          key={cp.id}
                          className={`p-3 rounded-xl border flex items-center justify-between text-xs ${
                            theme === 'dark' ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'
                          }`}
                        >
                          <div className="flex items-center gap-2">
                            <span className="line-through text-rose-400">{cp.informal}</span>
                            <ArrowRight className="w-3.5 h-3.5 opacity-50" />
                            <span className="font-bold text-emerald-400">{cp.replacement}</span>
                          </div>
                          <button
                            onClick={() => handleDeleteCustomVocab(cp.id)}
                            className="text-slate-500 hover:text-rose-400"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div
                  className={`p-5 rounded-2xl border shadow-sm transition-all space-y-3 ${
                    theme === 'dark' ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'
                  }`}
                >
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    歷次診斷紀錄 (Session History)
                  </h3>

                  <div className="space-y-2.5">
                    {progressHistory.map((item) => (
                      <div
                        key={item.id}
                        className={`p-3.5 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs ${
                          theme === 'dark'
                            ? 'bg-slate-950/80 border-slate-800'
                            : 'bg-slate-50 border-slate-200'
                        }`}
                      >
                        <div className="space-y-1">
                          <div className="flex items-center gap-2 flex-wrap">
                            <span className="font-bold opacity-60">{item.date}</span>
                            <span
                              className={`px-2 py-0.5 rounded font-bold ${
                                item.errorFreeRatio >= 65
                                  ? 'bg-emerald-500/20 text-emerald-400'
                                  : 'bg-amber-500/20 text-amber-400'
                              }`}
                            >
                              估評: Band {item.bandEstimate}
                            </span>
                            <span className="opacity-80">{item.note}</span>
                          </div>
                        </div>

                        <div className="flex items-center gap-3">
                          <div className="text-right">
                            <span className="text-[10px] block opacity-60">無錯句率</span>
                            <span
                              className={`text-sm font-bold ${
                                item.errorFreeRatio >= 65 ? 'text-emerald-400' : 'text-amber-400'
                              }`}
                            >
                              {item.errorFreeRatio}%
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}
          </main>

          <footer
            className={`border-t py-4 text-center text-xs opacity-50 ${
              theme === 'dark' ? 'border-slate-800' : 'border-slate-200'
            }`}
          >
            雅思寫作 Band 5.5 → 6.5+ 穩拿衝刺系統・完整單一 HTML 獨立運行版
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<IeltsAscenderApp />);
  </script>
</body>
</html>
